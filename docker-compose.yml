services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    # The model settings come from server/.env and nothing else: listing them under `environment`
    # with an empty default would override the file with "" and the container would start without
    # a model. MONGO_URL is the one value compose must replace, because inside the network the
    # database is the mongo service, not the URL in the file.
    env_file:
      - path: ./server/.env
        required: false
    environment:
      MONGO_URL: mongodb://mongo:27017/clario
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
    extra_hosts:
      - host.docker.internal:host-gateway
    # index.js exits when Mongo is not reachable yet, so the wait is a healthcheck, not "service
    # started", and the restart policy brings the API back after a reboot or a crash.
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Same check the Dockerfile has, repeated at the compose level so the proxy waits for a *serving*
    # API, not just a process that got past `depends_on`.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  proxy:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        # The API lives on the same host through the nginx proxy (/api → api:3000), so the client
        # build bakes in the relative path. Set VITE_API_URL=https://... ahead of the build for a
        # client served somewhere else.
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "8080:80"
    # The API is only healthy enough to route to once it can answer /health, so the proxy waits for
    # that instead of merely for the container to exist.
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
